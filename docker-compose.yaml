# Operator console as a container. Two services on purpose:
#
#   frontend-build  builds and tags the image, behind the `build` profile so
#                   `up` never starts a `next build` on the robot by accident:
#                       docker compose build frontend-build
#   frontend        runs that tag (built here or pulled). No `build:` block.
#
# Values come from .env (copy .env.example); NEXT_PUBLIC_* are build args (see
# the Dockerfile). The backend is not here: the page calls :3000 of the host it
# was opened from, so no shared network is needed.

services:
  frontend-build:
    profiles: ["build"]
    image: ${FRONTEND_IMAGE:-syncai-frontend}:${FRONTEND_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-}

  frontend:
    image: ${FRONTEND_IMAGE:-syncai-frontend}:${FRONTEND_TAG:-local}
    container_name: syncai_frontend
    restart: unless-stopped
    # server.js is PID 1 otherwise and does not forward SIGTERM to itself
    # cleanly; tini makes `docker compose stop` a fast stop, not a 10 s kill.
    init: true
    ports:
      # The container side is fixed at 3001 by the Dockerfile's PORT; only the
      # host side is configurable.
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      TZ: ${TZ:-Asia/Taipei}
    healthcheck:
      # The slim image ships no curl or wget, and Node 22 has fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
