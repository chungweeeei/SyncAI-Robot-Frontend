# Claude reviews every pull request into main or dev.
#
# This is the half of review that ci.yml cannot do. CI proves the code
# compiles, lints, passes 117 tests and builds; none of that catches the rules
# this repo actually lives by, because they are conventions rather than types:
# a write that forgets to invalidate a key its response affects, a zod schema
# written without the z.ZodType<T> annotation, an error string that names a ROS
# node or a shell command on a screen an end customer reads. All three are
# written down in CLAUDE.md and in .claude/skills/, which the reviewer reads
# from the checkout — so this workflow is what makes those files enforceable
# instead of merely documented.
#
# Findings land on the PR itself, inline on the lines they concern. That is
# what `--comment` buys: without it the review goes to the workflow run log,
# where nobody reads it. It is also what makes the review arrive by email —
# Claude posts as the GitHub App, a different actor from the PR author, so
# GitHub sends its ordinary review notification. No SMTP step needed.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, dev]

# A force-push makes the previous review obsolete before it has finished
# writing. Cancel it rather than pay for two and comment twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Read-only on the repository: a reviewer that can push is a reviewer that
    # can land its own suggestions. id-token is the one write, and it is for
    # the action's GitHub App authentication, not for the repo.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    # A runaway review is a billing event, not just a slow one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff comes from the API; the checkout is here so the reviewer
          # can read CLAUDE.md and .claude/skills/ — which is the whole point.
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth. For an API key instead, swap this line for
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required even though the skill's own frontmatter names the same
          # tool: the action only starts the inline-comment MCP server when
          # --allowedTools asks for it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
