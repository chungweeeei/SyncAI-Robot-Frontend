# Claude reviews every pull request into main or dev, against the conventions
# CI cannot check (a missed invalidation, an unannotated zod schema, internal
# names in UI copy). It reads CLAUDE.md and .claude/skills/ from the checkout,
# which is what makes them enforceable.
#
# `--comment` posts findings inline on the PR rather than in the run log; as a
# different actor from the author, the App also triggers GitHub's email.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, dev]

# A force-push makes the previous review obsolete before it has finished
# writing. Cancel it rather than pay for two and comment twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Read-only, so the reviewer cannot land its own suggestions. id-token is
    # for the action's GitHub App authentication, not the repo.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    # A runaway review is a billing event, not just a slow one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The diff comes from the API; the checkout is for CLAUDE.md and
          # .claude/skills/.
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth. For an API key instead, swap this line for
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required even though the skill's own frontmatter names the same
          # tool: the action only starts the inline-comment MCP server when
          # --allowedTools asks for it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
