# Builds the console image and publishes it to GHCR, so a robot pulls it
# instead of running `next build` on its own CPU.
#   - a push to main publishes a moving `main` tag plus `sha-<short>`;
#   - a `v*` tag on main publishes `1.2.3`, `1.2` and `latest`.
#
# Separate from ci.yml because a container build is minutes long and only
# matters after the gate has passed (a tag is cut on main, already through CI).
#
# Two native runners rather than QEMU (the robot is arm64; `next build` under
# emulation is slow and flaky). Each pushes by digest only and `publish` tags
# one merged manifest, so a half-finished run never leaves a broken tag.
#
# NEXT_PUBLIC_* are deliberately not passed: empty keeps the same-hostname
# fallback in lib/api/config.ts, the only value that works on every robot.
#
# One-time setup: GHCR creates the package private; set it public on GitHub,
# or the robot has to `docker login` before it can pull.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Safe to cancel mid-way: tags are applied in one command at the very end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # An arm64 failure should not hide an amd64 log, or vice versa.
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare names
        # GHCR rejects uppercase, so lowercase the repo once. The platform
        # pair is an artifact name suffix, where a slash is not allowed.
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        # Labels only at this stage (source, revision, licence…); the tags are
        # decided in `publish`, on the merged manifest.
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          # push-by-digest: the registry gets the image, but no tag points at
          # it until `publish` has both platforms in hand.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # GitHub Actions cache keyed per platform, so the `npm ci` layer is
          # reused between runs that only change source.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        # The digest travels to `publish` as an empty file named after it;
        # download-artifact merges the two platforms' files into one folder.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare names
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added automatically (flavor latest=auto) only when the
          # event is a semver tag push — a push to main never moves it.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-platform manifest and push tags
        working-directory: ${{ runner.temp }}/digests
        # One manifest list referencing both digests, given every tag at once.
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        # Fails if the manifest is missing a platform, which the previous
        # step's exit code cannot tell. Not piped into grep -q: under pipefail
        # an early grep exit fails the step on SIGPIPE.
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" > manifest.txt
          cat manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -q 'linux/amd64' manifest.txt
