# Runs the commands CLAUDE.md documents. Two parallel jobs so the slow one
# does not hide the fast one: `check` fails in about a minute on a lint or
# type error, `e2e` needs a production build and a browser.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package.json says >=22; pin the LTS rather than `latest` so a new
          # major landing upstream is a deliberate bump, not a red Monday.
          node-version: 22
          cache: npm

      # `ci`, not `install`: the lockfile is authoritative here.
      - run: npm ci

      - name: Lint
        # Also enforces the app -> components -> hooks -> lib import boundaries.
        run: npm run lint

      - name: Type check
        # Ahead of the build so a type error reports as a type error.
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # The real gate, and last because it is the slowest thing in this job.
        run: npm run build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only: both Playwright projects run on it, and the browser
      # download is the slowest step in this job.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Builds and starts the app itself; every test fakes its own backend,
        # so no service container is needed.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        # Traces are written on retry, which on CI is exactly the run somebody
        # will want to look at.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
